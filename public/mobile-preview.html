<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACT · Mobile viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6ebe6;color:#18332e;font:16px 'Trebuchet MS',sans-serif}header{text-align:center;padding:28px 16px 20px}small{font-size:11px;letter-spacing:2px;font-weight:bold}h1{font:32px Georgia,serif;margin:8px 0}p{margin:8px 0;color:#52665e;font-size:14px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px auto 0}button,a{font:inherit}button{border:1px solid #bccbc0;background:#f6f7f2;color:#173f37;border-radius:30px;padding:11px 15px;cursor:pointer;min-height:44px}button[aria-pressed=true]{background:#173f37;color:white}button:focus-visible,a:focus-visible{outline:3px solid #e97b62;outline-offset:3px}.stage{overflow:auto;padding:12px 16px 40px;display:grid;justify-items:center}.phone{width:414px;background:#203c34;border:10px solid #203c34;border-radius:42px;box-shadow:0 24px 60px #173f3726;overflow:hidden;flex-shrink:0}.status{height:28px;background:#f7f6f1;display:flex;justify-content:space-between;align-items:center;padding:0 23px;font-size:11px;font-weight:bold}.phone iframe{display:block;width:100%;height:780px;border:0;background:#f7f6f1}.home{height:22px;background:#f7f6f1;display:grid;place-items:center}.home:after{content:'';width:100px;height:4px;border-radius:5px;background:#203c34}a{display:inline-block;color:#173f37;padding:12px}#size{font-size:12px;margin-top:12px}@media(max-width:460px){header{padding-top:20px}.stage{justify-items:start}.phone{margin:0 auto}}
</style></head>
<body><header><small>ACT HEALTHY LONGEVITY</small><h1>Your app, on mobile.</h1><p>A live, interactive preview. Scroll inside the phone to explore.</p><div class="controls" aria-label="Choose phone size"><button data-width="360" data-height="740" aria-pressed="false">Small · 360</button><button data-width="390" data-height="780" aria-pressed="true">Standard · 390</button><button data-width="430" data-height="860" aria-pressed="false">Large · 430</button></div><div id="size" role="status">390 × 780 CSS pixels</div><a href="./" target="_blank" rel="noopener">Open full app ↗</a></header><main class="stage"><section class="phone" aria-label="Mobile device preview"><div class="status" aria-hidden="true"><span>9:41</span><span>●●● &nbsp; ▰</span></div><iframe src="./" title="ACT app mobile preview"></iframe><div class="home" aria-hidden="true"></div></section></main><script>
const phone=document.querySelector('.phone'),frame=document.querySelector('iframe');
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));phone.style.width=(Number(button.dataset.width)+20)+'px';frame.style.height=button.dataset.height+'px';document.querySelector('#size').textContent=button.dataset.width+' × '+button.dataset.height+' CSS pixels';}));phone.style.width='410px';
</script></body></html>
